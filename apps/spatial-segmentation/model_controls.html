<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House V / Vision Lab</title>
  <link rel="stylesheet" href="/housev.css">
  <script src="/housev.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark">V</span>
        <div><strong>HOUSE V</strong><small>VISION LAB <i>//</i> OAK 4 D PRO</small></div>
      </div>
      <div class="headline-stats">
        <span class="status-dot"></span><span id="connection-status">CONNECTING</span>
        <span class="separator"></span><span>YOLOV8-L SEG</span>
        <span class="separator"></span><span id="frame-status">FRAME --</span>
      </div>
      <nav class="lab-nav" aria-label="House V modes">
        <button type="button" data-lab-mode="spatial" aria-pressed="true">VISION LAB</button>
        <button type="button" data-lab-mode="training" aria-pressed="false">TRAINING LAB</button>
        <span id="lab-state"></span>
      </nav>
      <div class="control-cluster">
        <label>CONF <output id="confidence-value">0.25</output>
          <input id="confidence" type="range" min="0" max="1" step="0.01" value="0.25"></label>
        <label>IOU <output id="iou-value">0.50</output>
          <input id="iou" type="range" min="0" max="1" step="0.01" value="0.50"></label>
        <label>YOLO PASS/S <output id="inference-value">30</output>
          <input id="inference-fps" type="range" min="10" max="30" step="1" value="30"></label>
        <label>IR DOT <output id="ir-value">0.50</output>
          <input id="ir-intensity" type="range" min="0.05" max="1" step="0.05" value="0.50"></label>
        <button id="ir-toggle" class="chip" aria-pressed="false">IR OFF</button>
      </div>
    </header>

    <nav class="modebar" aria-label="Camera source and display mode">
      <span class="mode-label">SOURCE</span>
      <button data-mode="color" aria-pressed="true">COLOR</button>
      <button data-mode="left" aria-pressed="false">MONO / L</button>
      <button data-mode="right" aria-pressed="false">MONO / R</button>
      <button data-mode="detections" aria-pressed="false">TARGETS ONLY</button>
      <span class="mode-divider"></span>
      <button id="overlay-toggle" aria-pressed="true">LOCKS ON</button>
      <button id="lidar-toggle" aria-pressed="true">L2 POINTS ON</button>
      <button id="pip-toggle" aria-pressed="false">SPATIAL MAIN</button>
      <button id="video-reconnect" type="button" hidden>RECONNECT RGB</button>
      <span id="lidar-status" class="lidar-status">L2 CONNECTING · UNCALIBRATED</span>
      <div id="zoom-controls" hidden>
        <span class="mode-label">ZOOM ROI</span>
        <label>X <input id="zoom-x" type="range" min="0.25" max="0.75" step="0.01" value="0.50"></label>
        <label>Y <input id="zoom-y" type="range" min="0.25" max="0.75" step="0.01" value="0.50"></label>
      </div>
      <span id="mode-note"></span>
    </nav>

    <div class="workspace">
      <main id="view" aria-label="Camera view"></main>
      <aside class="intel-panel">
        <div class="panel-heading"><span id="index-title">TARGET INDEX</span>
          <button id="index-mode" type="button">LONGEST IDS</button>
          <output id="target-count">00</output></div>
        <div id="target-list"><p class="empty">Waiting for scene metadata…</p></div>
        <div class="map-heading">SPATIAL FIELD <span>L2 FACES · RED NEAR → CYAN FAR</span></div>
        <canvas id="spatial-map" width="280" height="190" aria-label="Top-down target positions"></canvas>
        <div class="panel-foot"><span id="scene-age">AGE --</span><span id="range-count">RANGE --</span></div>
      </aside>
    </div>
    <footer><span>HOUSE V <i>//</i> PERCEPTION BASELINE</span>
      <span>COLOR / STEREO / TARGET DATA · POWERED BY DEPTHAI</span></footer>
  </div>
</body>
</html>
